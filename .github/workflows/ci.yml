name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.41.5'

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/lumio_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart analyze --fatal-infos
      - run: dart test

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: flutter test
      - run: flutter build apk --release --target-platform android-arm

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            build: macos
          - os: windows-latest
            build: windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ${{ matrix.build }} --release

  backend:
    runs-on: ubuntu-latest
    # Job actif dès que backend/package-lock.json existe.
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: |
          if [ -f backend/package-lock.json ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.has.outputs.ok == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - if: steps.has.outputs.ok == 'true'
        working-directory: backend
        run: npm ci
      - if: steps.has.outputs.ok == 'true'
        working-directory: backend
        run: npx vitest run

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: bash scripts/check-licenses.sh
      - run: bash scripts/test-check-licenses.sh
