name: Release

# Publication d'une version : tag `vX.Y.Z` (doit correspondre à pubspec.yaml).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.41.5'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Version du tag et de pubspec
        id: ver
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pub="$(sed -n 's/^version: *\([0-9.]*\)+.*/\1/p' app/pubspec.yaml)"
          if [ "$version" != "$pub" ]; then
            echo "Le tag ($version) ne correspond pas à pubspec.yaml ($pub)." >&2
            exit 1
          fi
          grep -q "^## \[$version\]" CHANGELOG.md || { echo "Section $version absente du CHANGELOG." >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@v1
      - name: Tests lumio_core
        working-directory: packages/lumio_core
        run: |
          dart pub get
          dart analyze --fatal-infos
          dart test

      - uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2.19.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Tests de l'application
        working-directory: app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze --fatal-infos
          flutter test

      # TorrServer : binaires officiels épinglés (version + SHA-256).
      - uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/lumio-torrserver
          key: torrserver-${{ hashFiles('scripts/torrserver.pins') }}
      - run: bash scripts/fetch-torrserver.sh
      - run: bash scripts/fetch-torrserver.sh --verify

      - name: Construire et signer les APK
        working-directory: app
        env:
          KEYSTORE_B64: ${{ secrets.LUMIO_KEYSTORE_BASE64 }}
          LUMIO_KEYSTORE_PASSWORD: ${{ secrets.LUMIO_KEYSTORE_PASSWORD }}
          LUMIO_KEY_PASSWORD: ${{ secrets.LUMIO_KEY_PASSWORD }}
          LUMIO_KEY_ALIAS: ${{ secrets.LUMIO_KEY_ALIAS }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          [ -n "$KEYSTORE_B64" ] || { echo "Secret du keystore absent." >&2; exit 1; }
          export LUMIO_KEYSTORE_FILE="$RUNNER_TEMP/lumio-release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$LUMIO_KEYSTORE_FILE"
          chmod 600 "$LUMIO_KEYSTORE_FILE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/lumio-$VERSION-armeabi-v7a.apk"
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/dist/lumio-$VERSION-arm64-v8a.apk"

      - name: Supprimer le keystore du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/lumio-release.jks"

      - name: Vérifier la signature
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -uo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -1)"
          echo "apksigner : $apksigner"
          status=0
          for abi in armeabi-v7a arm64-v8a; do
            out="$("$apksigner" verify --print-certs "dist/lumio-$VERSION-$abi.apk" 2>&1)" || { echo "$out"; echo "APK $abi : signature invalide." >&2; status=1; continue; }
            echo "$out" | grep -E 'certificate (DN|SHA-256)' || true
            if ! echo "$out" | grep -q 'CN=Lumio'; then
              echo "APK $abi : certificat de release attendu." >&2
              status=1
            fi
          done
          exit $status

      - name: Sommes, copies à nom stable, manifeste, notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd dist
          sum() { sha256sum "$1" | cut -d' ' -f1; }
          s32="$(sum lumio-$VERSION-armeabi-v7a.apk)"
          s64="$(sum lumio-$VERSION-arm64-v8a.apk)"
          cp "lumio-$VERSION-armeabi-v7a.apk" lumio-armeabi-v7a.apk
          cp "lumio-$VERSION-arm64-v8a.apk" lumio-arm64-v8a.apk
          sha256sum lumio-$VERSION-armeabi-v7a.apk lumio-$VERSION-arm64-v8a.apk > SHA256SUMS.txt
          base="https://github.com/$REPO/releases/download/v$VERSION"
          cat > update.json <<JSON
          {
            "version": "$VERSION",
            "apk": "$base/lumio-$VERSION-armeabi-v7a.apk",
            "sha256": "$s32",
            "apks": {
              "armeabi-v7a": {"apk": "$base/lumio-$VERSION-armeabi-v7a.apk", "sha256": "$s32"},
              "arm64-v8a": {"apk": "$base/lumio-$VERSION-arm64-v8a.apk", "sha256": "$s64"}
            }
          }
          JSON
          python3 -c "import json;json.load(open('update.json'))"
          {
            echo "## Lumio $VERSION"
            echo
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" {on=1; next}
              on && /^## \[/ {exit}
              on {print}
            ' ../CHANGELOG.md
            echo
            echo "## Quel fichier télécharger ?"
            echo
            echo "- **lumio-$VERSION-armeabi-v7a.apk** : box et TV Android 32 bits (la plupart des box Google TV d'entrée de gamme)."
            echo "- **lumio-$VERSION-arm64-v8a.apk** : téléphones, tablettes et box 64 bits."
            echo
            echo "Installation pas à pas : https://vantaflow.github.io/lumio/"
            echo
            echo "## Sommes SHA-256"
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --title "Lumio $VERSION" \
            --notes-file notes.md \
            dist/lumio-$VERSION-armeabi-v7a.apk \
            dist/lumio-$VERSION-arm64-v8a.apk \
            dist/lumio-armeabi-v7a.apk \
            dist/lumio-arm64-v8a.apk \
            dist/SHA256SUMS.txt \
            dist/update.json
