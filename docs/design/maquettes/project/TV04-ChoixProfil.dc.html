<div class="p"><div class="av" style="background:#161B22;border:3px dashed #5B6676;color:#A9B2BF;font-size:72px">+</div>Ajouter</div>
</div>
<div style="position:absolute;left:560px;top:690px;width:800px;height:300px;border-radius:32px;background:#161B22;display:flex;flex-direction:column;align-items:center;padding-top:28px;box-sizing:border-box;gap:24px">
