<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pop-up éditeur de profil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Manrope:wght@400;600;700&display=swap">
<style>
body{margin:0}
.tv{width:1920px;height:1080px;background:#0E1116;color:#F3F5F7;font-family:'Manrope',sans-serif;font-size:28px;position:relative;overflow:hidden;box-sizing:border-box}
.tv *{box-sizing:border-box}
.hd{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;margin:0}
button,a,label{font-family:inherit;color:inherit;text-decoration:none;cursor:pointer}
button{border:0;background:none;font-size:inherit;padding:0}
.top{height:152px;display:flex;align-items:center;gap:28px;padding:0 96px}
.back{width:72px;height:72px;border-radius:36px;background:#161B22;display:flex;align-items:center;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:14px;height:76px;padding:0 40px;border-radius:38px;font-weight:700;font-size:28px;background:#2A3340;color:#F3F5F7;white-space:nowrap}
.bp{background:#FFB84D;color:#1A1100}
.bd{background:#FF7A70;color:#1A0A08}
.bt{background:transparent;color:#C9D0DA;font-weight:600}
.bx{color:#FF7A70}
.fx{outline:4px solid #FFE08A;outline-offset:4px}
.sm{font-size:24px;color:#A9B2BF;line-height:1.35}
.md{font-size:28px;color:#C9D0DA;line-height:1.4}
.sec{font-size:26px;font-weight:700;color:#4FD1C5;letter-spacing:1px;margin:0 0 16px}
.row{display:flex;align-items:center;gap:24px;min-height:104px;border-radius:22px;background:#161B22;padding:0 32px}
.row .t{font-size:30px;font-weight:700}
.fld{display:block}
.fld .l{font-size:24px;color:#A9B2BF;font-weight:600;margin-bottom:8px}
.inp{display:flex;align-items:center;height:80px;border-radius:18px;background:#0E1116;border:2px solid #3A4452;padding:0 24px;font-size:30px;font-weight:600;width:100%;text-align:left}
.inp.ph{color:#6F7B8B}
.err{color:#FF7A70;font-size:26px;font-weight:600;margin-top:10px;display:flex;gap:10px;align-items:center}
.tg{width:84px;height:46px;border-radius:23px;position:relative;flex:none;display:inline-block}
.tg i{position:absolute;top:6px;width:34px;height:34px;border-radius:17px;background:#F3F5F7}
.on{background:#FFB84D}.on i{right:6px}.off{background:#3A4452}.off i{left:6px}
.dim{position:absolute;left:0;top:0;width:1920px;height:1080px;background:rgba(6,8,12,.76)}
.pan{background:#161B22;border-radius:32px;padding:44px 48px;display:flex;flex-direction:column;gap:20px;box-shadow:0 24px 80px rgba(0,0,0,.5)}
.pan h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:700;margin:0;font-size:44px;line-height:1.15}
.acts{display:flex;gap:16px;justify-content:flex-end;margin-top:12px}
.snack{position:absolute;left:50%;transform:translateX(-50%);bottom:64px;background:#2A3340;border-radius:18px;padding:22px 36px;font-size:26px;font-weight:600;display:flex;gap:14px;align-items:center;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.chip{display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 24px;border-radius:28px;background:#2A3340;font-weight:700;font-size:26px}
.chip.sel{background:#FFB84D;color:#1A1100}
.hl{display:inline-flex;align-items:center;gap:10px;font-size:24px;font-weight:700;color:#C9D0DA}
.hl b{width:14px;height:14px;border-radius:7px;display:inline-block}
.note{position:absolute;font-size:24px;font-weight:700;color:#4FD1C5;letter-spacing:.5px}
.poster{border-radius:18px;display:flex;align-items:flex-end;padding:16px;font-weight:700;font-size:26px;line-height:1.15;font-family:'Bricolage Grotesque',sans-serif}
.stv{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.card{background:#161B22;border-radius:24px;padding:36px}
</style>
</helmet>
<div class="tv">
<h1 class="hd" style="position:absolute;top:90px;left:0;width:1920px;text-align:center;font-size:72px">Qui regarde ?</h1><div style="position:absolute;top:290px;left:0;width:1920px;display:flex;justify-content:center;gap:96px"><div style="display:flex;flex-direction:column;align-items:center;gap:14px;font-size:32px;font-weight:600"><span style="width:200px;height:200px;border-radius:100px;background:#FFB84D;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-size:88px;font-weight:700;color:#1A1100">L</span>Lilou</div><div style="display:flex;flex-direction:column;align-items:center;gap:14px;font-size:32px;font-weight:600"><span style="width:200px;height:200px;border-radius:100px;background:#4FD1C5;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-size:88px;font-weight:700;color:#1A1100">Y</span>Youssef</div><div style="display:flex;flex-direction:column;align-items:center;gap:14px;font-size:32px;font-weight:600"><span style="width:200px;height:200px;border-radius:100px;background:#FF8A7A;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-size:88px;font-weight:700;color:#1A1100">S</span>Sara</div><div style="display:flex;flex-direction:column;align-items:center;gap:14px;font-size:32px;font-weight:600"><span style="width:200px;height:200px;border-radius:100px;background:#9AD66B;display:flex;align-items:center;justify-content:center;font-family:'Bricolage Grotesque';font-size:88px;font-weight:700;color:#1A1100">E</span>Enfants</div></div><div class="dim"></div><div class="pan" role="dialog" aria-modal="true" style="position:absolute;left:460px;top:50%;transform:translateY(-50%);width:1000px;"><h2>Modifier le profil</h2>
<label class="fld"><div class="l">Nom</div><div class="inp fx" style=""><span style="flex:1">Enfants</span><span class="sm">7/20</span></div></label>
<button type="button" class="row" style="min-height:104px;background:#0E1116;width:100%;text-align:left;padding:0 24px;gap:20px"><div style="flex:1"><div style="font-size:28px;font-weight:700">Profil enfant</div><div class="sm">Contenus filtrés selon l'âge ; réglages et changement de profil protégés par le PIN parent.</div></div><span class="tg on"><i></i></span></button>
<div class="md">Limite d'âge</div><div style="display:flex;gap:12px"><button type="button" class="chip" style="height:64px;padding:0 32px">Tous publics</button><button type="button" class="chip" style="height:64px;padding:0 32px">7+</button><button type="button" class="chip sel" style="height:64px;padding:0 32px">12+</button><button type="button" class="chip" style="height:64px;padding:0 32px">16+</button></div>
<div class="sm">Pour un profil adulte, l'option « Verrouiller par PIN » remplace la limite d'âge : « Le PIN parent est demandé pour ouvrir ce profil. »</div>
<div class="acts" style="justify-content:space-between"><button type="button" class="btn bt bx">Supprimer</button><div style="display:flex;gap:16px"><button type="button" class="btn bt">Annuler</button><button type="button" class="btn bp">Enregistrer</button></div></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic { renderVals(){ return {}; } }
</script>
</body>
</html>
